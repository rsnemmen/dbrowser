[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbrowser"
version = "0.1.0"
description = "Yazi-like terminal file browser for Dropbox, backed by rclone"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "rich>=13.0",
]

[project.scripts]
dbrowser = "dbrowser.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbrowser"]
