[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dropbox-cli"
version = "0.1.0"
description = "Yazi-like terminal file browser for Dropbox, backed by rclone"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0",
]

[project.scripts]
dropbox-cli = "dropbox_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dropbox_cli"]
