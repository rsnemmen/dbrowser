      <tspan fill="#4a4a60">  │  </tspan>
      <tspan fill="#ffa62b">/</tspan><tspan fill="#c0c0d0"> Filter</tspan>
      <tspan fill="#4a4a60">  │  </tspan>
      <tspan fill="#ffa62b">r</tspan><tspan fill="#c0c0d0"> Refresh</tspan>
      <tspan fill="#4a4a60">  │  </tspan>
      <tspan fill="#ffa62b">s</tspan><tspan fill="#c0c0d0"> Sync</tspan>
      <tspan fill="#4a4a60">  │  </tspan>
